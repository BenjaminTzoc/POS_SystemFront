<div class="flex flex-col gap-1 w-full" [ngClass]="widthClass">
  <div class="relative flex items-center w-full">
    <p-select
      [options]="sortedBranches"
      [ngModel]="value"
      (ngModelChange)="onModelChange($event)"
      optionLabel="name"
      optionValue="id"
      [showClear]="showClear && !!value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [size]="size"
      appendTo="body"
      class="shadow-2xs w-full group"
      [styleClass]="(size === 'small' ? '!rounded-lg h-8! text-xs' : '!rounded-xl h-9! text-xs') + ' ' + (disabled ? '!bg-slate-100/90 !border-slate-300/80 !text-slate-400 !cursor-not-allowed opacity-75 grayscale-30 shadow-none' : '!bg-rose-50/40 !border-[#48021C]/25 hover:!border-[#48021C]/60 hover:!bg-white focus:!border-[#48021C] focus:!ring-2 focus:!ring-[#48021C]/10') + ' w-full transition-all duration-200'"
    >
      <!-- Plantilla de Valor Seleccionado con Icono y Truncado -->
      <ng-template #selectedItem let-selectedOption>
        @if (selectedOption) {
          <div class="flex items-center gap-2 text-sm font-semibold min-w-0 w-full" [ngClass]="disabled ? 'text-slate-500' : 'text-slate-800'">
            <span class="w-5 h-5 rounded-md flex items-center justify-center shrink-0 border" [ngClass]="disabled ? 'bg-slate-200/80 text-slate-500 border-slate-300' : 'bg-[#48021C]/10 text-[#48021C] border-[#48021C]/20'">
              <i class="pi pi-building text-xs"></i>
            </span>
            <span class="truncate flex-1">{{ selectedOption.name }}</span>
          </div>
        } @else {
          <div class="flex items-center gap-2 text-sm text-slate-400 min-w-0 w-full">
            <span class="w-5 h-5 rounded-md flex items-center justify-center shrink-0 border" [ngClass]="disabled ? 'bg-slate-200/60 text-slate-400 border-slate-300' : 'bg-rose-50 text-[#48021C]/60 border-[#48021C]/10'">
              <i class="pi pi-building text-xs"></i>
            </span>
            <span class="truncate flex-1 italic">{{ placeholder }}</span>
          </div>
        }
      </ng-template>

      <!-- Plantilla de Opciones del Dropdown con Badge de Planta -->
      <ng-template #item let-branch>
        <div class="flex items-center justify-between gap-2 py-1 text-sm">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="w-6 h-6 rounded-md bg-rose-50 text-[#48021C] flex items-center justify-center shrink-0 border border-rose-200">
              <i class="pi pi-building text-xs"></i>
            </span>
            <span class="font-medium text-slate-800 truncate">{{ branch.name }}</span>
          </div>
          @if (branch.isPlant) {
            <span class="px-1.5 py-0.5 text-[10px] font-bold uppercase rounded bg-purple-50 text-purple-700 border border-purple-200">
              Planta
            </span>
          }
        </div>
      </ng-template>
    </p-select>
  </div>
</div>
