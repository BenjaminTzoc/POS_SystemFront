<div class="flex flex-col gap-1 w-full" [ngClass]="widthClass">
  <div class="relative flex items-center w-full">
    <p-select
      [options]="customers"
      [ngModel]="value"
      (ngModelChange)="onModelChange($event)"
      optionLabel="name"
      optionValue="id"
      [filter]="true"
      filterBy="name,nit"
      [showClear]="showClear && !!value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [size]="size"
      appendTo="body"
      class="shadow-2xs w-full group"
      [styleClass]="(size === 'small' ? '!rounded-lg h-8! text-xs' : '!rounded-xl h-9! text-xs') + ' ' + (disabled ? '!bg-slate-100/90 !border-slate-300/80 !text-slate-400 !cursor-not-allowed opacity-75 grayscale-30 shadow-none' : '!bg-rose-50/40 !border-[#48021C]/25 hover:!border-[#48021C]/60 hover:!bg-white focus:!border-[#48021C] focus:!ring-2 focus:!ring-[#48021C]/10') + ' w-full transition-all duration-200'"
    >
      <!-- Plantilla de Valor Seleccionado sin icono forzado -->
      <ng-template #selectedItem let-selectedOption>
        @if (selectedOption) {
          <div class="flex items-center gap-2 text-xs font-semibold min-w-0 w-full" [ngClass]="disabled ? 'text-slate-500' : 'text-slate-800'">
            <span class="truncate flex-1">{{ selectedOption.name }}</span>
          </div>
        } @else {
          <div class="flex items-center gap-2 text-xs text-slate-400 min-w-0 w-full">
            <span class="truncate flex-1 italic">{{ placeholder }}</span>
          </div>
        }
      </ng-template>

      <!-- Plantilla de Opciones en Dropdown -->
      <ng-template #item let-customer>
        <div class="flex items-center justify-between gap-2 py-0.5 text-xs w-full">
          <div class="flex flex-col min-w-0">
            <span class="font-semibold text-slate-800 truncate text-xs">{{ customer.name }}</span>
            <span *ngIf="customer.nit" class="text-[10px] text-slate-400">NIT: {{ customer.nit }}</span>
          </div>
          <span *ngIf="customer.phone" class="text-[10px] font-medium text-slate-400 shrink-0">
            {{ customer.phone }}
          </span>
        </div>
      </ng-template>
    </p-select>
  </div>
</div>
