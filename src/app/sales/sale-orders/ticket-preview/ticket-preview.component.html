<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [showHeader]="false"
  [dismissableMask]="true"
  [style]="{ width: '850px', 'max-width': '95vw', 'max-height': '94vh' }"
  contentStyleClass="!p-4 sm:!p-5 !overflow-hidden flex flex-col"
  [draggable]="false"
  [resizable]="false"
  appendTo="body"
  styleClass="rounded-2xl overflow-hidden shadow-2xl bg-white"
  (onHide)="onClose()"
>
  <div class="preview-content flex flex-col h-full min-h-0 max-h-[88vh]">
    <!-- Header with Title and Close Button (Compacto y sin icono) -->
    <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-100 flex-shrink-0">
      <h3 class="text-sm font-semibold text-slate-800 tracking-tight leading-none">
        Comprobante de Venta <span *ngIf="sale?.invoiceNumber" class="text-spiced-purple text-xs font-bold">#{{ sale.invoiceNumber }}</span>
      </h3>
      <button 
        type="button" 
        (click)="onClose()"
        class="w-7 h-7 -mr-1 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors border-none bg-transparent cursor-pointer"
        pTooltip="Cerrar vista previa"
      >
        <i class="pi pi-times text-xs"></i>
      </button>
    </div>

    <!-- The actual ticket template that will be captured (ÚNICO SCROLL) -->
    <div class="ticket-wrapper flex-1 min-h-0 overflow-y-auto">
      <app-ticket-template *ngIf="sale" [sale]="sale"></app-ticket-template>
    </div>

    <!-- Actions Footer Grid (Fijo Abajo) -->
    <div class="actions-grid mt-2.5 pt-2.5 border-t border-slate-100 flex-shrink-0">
      <p-button
        label="Imprimir"
        icon="pi pi-print"
        severity="primary"
        [loading]="isPrinting()"
        (click)="onPrint()"
        styleClass="w-full"
      >
      </p-button>

      <p-button
        label="Descargar"
        icon="pi pi-download"
        severity="secondary"
        [loading]="isDownloading()"
        (click)="onDownload()"
        styleClass="w-full"
      >
      </p-button>

      <p-button
        label="Enviar Email"
        icon="pi pi-envelope"
        severity="info"
        [loading]="isSendingEmail()"
        (click)="onSendEmail()"
        styleClass="w-full"
      >
      </p-button>

      <p-button
        label="WhatsApp"
        icon="pi pi-whatsapp"
        severity="success"
        [loading]="isSendingWhatsApp()"
        (click)="onSendWhatsApp()"
        styleClass="w-full"
      >
      </p-button>
    </div>
  </div>
</p-dialog>
