<div
  class="relative"
  #searchContainer
  [style.--search-enter-y]="openUpward ? '10px' : '-10px'"
>
  <p-floatLabel variant="on">
    <input
      pInputText
      id="SearchInput"
      type="text"
      autocomplete="off"
      [(ngModel)]="searchQuery"
      (input)="onSearchProduct()"
      (focus)="onFocus()"
      [disabled]="disabled"
      class="w-full"
    />
    <label for="SearchInput">Búsqueda de productos</label>
  </p-floatLabel>
  @if (showProductResults) {
  <div
    [@fadeInOut]
    class="absolute z-50 rounded-lg border border-gray-300 w-full bg-white shadow-lg overflow-hidden max-h-72 overflow-y-auto"
    [class.bottom-full]="openUpward"
    [class.mb-2]="openUpward"
    [class.top-full]="!openUpward"
    [class.mt-2]="!openUpward"
  >
    <div class="flex flex-col">
      @if (filteredProducts.length === 0) {
      <div class="flex justify-center items-center gap-2 py-6 text-sm text-slate-500">
        <i class="pi pi-exclamation-circle"></i>
        Sin resultados
      </div>
      } @else {
        @for (product of filteredProducts; track product.id) {
          <button
            type="button"
            class="flex items-center gap-3 w-full text-left px-3 py-2 cursor-pointer hover:bg-rose-50/60 border-b border-slate-100 last:border-0"
            (click)="selectProduct(product)"
          >
            <div class="w-10 h-10 rounded-lg shrink-0 overflow-hidden border border-slate-200 bg-slate-50 flex items-center justify-center">
              @if (product.imageUrl) {
                <img [src]="getProductImageUrl(product.imageUrl)" [alt]="product.name" class="w-full h-full object-cover" />
              } @else {
                <i class="pi pi-image text-slate-300 text-sm"></i>
              }
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-semibold text-slate-800 truncate">{{ product.name }}</p>
              <p class="text-[11px] text-slate-500 truncate">
                @if (product.sku) {
                  <span>SKU {{ product.sku }}</span>
                }
                @if (!catalogMode && product.stock != null) {
                  <span class="text-emerald-700"> · {{ product.stock }}{{ product.unit?.abbreviation || '' }}</span>
                }
              </p>
            </div>
            <span class="shrink-0 text-sm font-bold tabular-nums text-[#48021C]">
              {{ product.price | currency:'Q ':'symbol':'1.2-2' }}
            </span>
          </button>
        }
      }
    </div>
  </div>
  }
</div>
