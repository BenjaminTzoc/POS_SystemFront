  <div class="p-4 sm:p-6 bg-[#f8fafcf3] min-h-screen">
  <header class="dash-head no-print">
    <div class="min-w-0">
      <h1 class="dash-head-title">Panel de control</h1>
      <p class="dash-head-sub">Ventas, cobros y operación del día</p>
    </div>
    @if (canFilterByBranch()) {
      <app-branch-select
        [branches]="branches()"
        [ngModel]="selectedBranchId()"
        placeholder="Todas las sucursales"
        [showClear]="true"
        widthClass="w-full sm:w-[16.5rem]"
        (selectionChange)="onBranchChange($event)"
      />
    }
  </header>

  <div class="mb-6 sm:mb-8 no-print w-full flex flex-col xl:flex-row gap-4 items-stretch">
    <app-customer-week-widget class="shrink-0" />
    <app-today-pulse />
  </div>

  <div class="calendar-payments-row mb-6 sm:mb-8 no-print w-full">
    <app-collections-calendar class="shrink-0" />
    <div class="today-payments-slot">
      <app-today-payments />
    </div>
  </div>
</div>
